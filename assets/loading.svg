<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 80">
  <defs>
    <style>
        .cls-1 {
            fill: #fff;
        }

        .cls-3 {
            fill: #c03627;
        }

        .cls-4 {
            fill: #2c160c;
        }

        .dot {
            fill: #7ea3d6;

        }

        @keyframes dot1 {
            0%, 5% { opacity: 0; }
            20%, 100% { opacity: 1; }
        }

        @keyframes dot2 {
            0%, 15% { opacity: 0; }
            30%, 100% { opacity: 1; }
        }

        @keyframes dot3 {
            0%, 25% { opacity: 0; }
            40%, 100% { opacity: 1; }
        }

        .dot1 { animation: dot1 3.5s infinite; }
        .dot2 { animation: dot2 3.5s infinite; }
        .dot3 { animation: dot3 3.5s infinite; }

        #eraser {
            animation: erase 3.5s infinite ease-in-out, opacity 3.5s infinite;

            transform-box: fill-box;
            transform-origin: center;
        }

        #maskRect {
            animation: erase 3.5s infinite ease-in-out;
        }

        @keyframes erase {
            0%,40% {
                transform: translateX(0px);
            }

            65%,100% {
                transform: translateX(-165px);
            }
        }

        @keyframes opacity {
            0%, 35% { opacity: 0} 50%,70% { opacity: 1; } 85%, 100% { opacity: 0; }
        }

    </style>

      <mask id='mask'>
        <rect width='250' height='90' fill='#fff'/>
        <rect id='maskRect'
            x="200"
            width="250"
            height="80"
            fill="black"/>
      </mask>
  </defs>

    <g mask='url(#mask)'>
        <circle class="dot dot1" cx="72.02" cy="55.86" r="11.22"/>
        <circle class="dot dot2" cx="125" cy="55.86" r="11.22"/>
        <circle class="dot dot3" cx="177.98" cy="55.86" r="11.22"/>
    </g>

