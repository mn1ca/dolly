<html>
    <head>
        <meta name='viewport' content='width=850'>
        <meta charset='UTF-8'>

        <title></title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

        <style>

            body {
                font-family: 'Balsamiq Sans', sans-serif;
                background-color: #ede0ce;
                color: #6b4136;
                cursor: url(/assets/cursor/default.svg), default;

                overflow-x: hidden;

                -webkit-user-select: none;
                user-select: none;
            }

            #wrapper {
                width: 90vw;
                position: relative;
                margin: auto;

                display: flex;
                flex-direction: column;
            }

            canvas {
                display: none;
            }

            #loading {
                width: 300px;
                height: 100px;
                position: relative;
                inset: 0;
                margin: 150px auto;

                background-image: url(/assets/loading.svg);
                background-size: cover;

                display: flex;
                justify-content: center;
                align-items: flex-end;
                z-index: -1
            }

            #loading-text {
                position: relative;
                top: 20px;

                font-family: Nanum Pen Script;
                font-weight: bold;
                font-size: 130%;
            }

            img {
                width: 325px;
                position: absolute;
                inset: 0;
                margin: 50px auto;
            }

            #bottom {
                position: relative;
                margin: auto;
                text-align: center;
            }

            a, a:visited {
                cursor: url(/assets/cursor/pointer.svg), pointer;
                text-decoration: none;
                color: #c1331c;
                font-weight: bold;
            }

            .return {
                margin: 12px auto;
                width: 100px;
            }

            .return:hover {
                transform: scale(1.15);
                transition: .5s;
            }

            ::selection {
                background-color: #6b4136;
                color: white;
            }

            .hide {
                display: none;
            }

            #stickers {
                position: absolute;
                width: 100%;

                z-index: 1000;
                pointer-events: none;
            }

            #stickers img {
                position: absolute;
                height: 90px;
                filter: drop-shadow(2px 2px 5px rgba(60,10,0,0.5));
            }

            #stickers > :nth-child(1) {
                top: 0px;
                left: -380px;
            }

            #stickers > :nth-child(2) {
                top: 125px;
                left: -500px;
            }

            #stickers > :nth-child(3) {
                top: -40px;
                right: -300px;
            }

            #stickers > :nth-child(4) {
                top: 50px;
                right: -460px;
            }

            #stickers > :nth-child(5) {
                top: 200px;
                right: -360px;
            }

        </style>

        <!-- favicon -->
        <link rel='icon' href='/assets/cursor/default.svg'>
    </head>


<body>
    <div id='wrapper'>
        <div id='loading'>
            <div id='loading-text'>(loading image)</div>
        </div>
        <div id='bottom'>
            right click / long press on the image to save it
        <a href='/'><div class='return'>go back</div></a>
        </div>
        <canvas id='canvas' height='512' width='512'></canvas>

        <div id='stickers'>
            <img src='/assets/stickers/0.svg'>
            <img src='/assets/stickers/1.svg'>
            <img src='/assets/stickers/2.svg'>
            <img src='/assets/stickers/3.svg'>
            <img src='/assets/stickers/4.svg'>
        </div>
    </div>

</body>


<script type='module'>
    import anims from '/assets/parts/animation.json' with { type: 'json' };
    import {generateStickers} from '/script/useful.js';
    import {drawAll} from '/script/draw.js';
    import {createGIF} from '/script/animate.js';
    import {parts} from '/script/state.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');


    window.addEventListener('DOMContentLoaded', async () => {

        generateStickers(5);

        if (parts.background.src && parts.background.variant === -1)
            parts.background.img = await loadImage(parts.background.src);

        const animation = parts.animation.variant;
        if (animation) {
            parts.animation.frame = anims[animation].keyframe;
            drawAll(true);
        } else {
            drawAll();
        }

        download();
    });


    function loadImage(src) {
        const img = new Image();
        img.src = src;
        URL.revokeObjectURL(src);
        return img;
    }


    function download() {
        if (parts.animation.format === 'png') {
            const dataURL = canvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = dataURL;
            document.getElementById('wrapper').append(img);
        } else if (parts.animation.format === 'gif') {
            createGIF();
        }

    }

</script>
</html>
