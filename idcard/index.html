<!DOCTYPE html>
<html lang='en-US' data-theme='1'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width'>
        <meta name='robots' content='noai, noimageai'>

        <title>Dollymaker</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <style>

            [data-theme='0'] {
                --bg: #f5e1ed;
                --main: #cf5fa4;
                --text: #9e2374;
            }

            [data-theme='1'] {
                --bg: #fce8f1;
                --main: #f491b0;
                --text: #bc2060 ;
            }

            [data-theme='2'] {
                --bg: #fce8f1;
                --main: #f37576;
                --text: #961a36;
            }

            [data-theme='3'] {
                --bg: #f7d4b4;
                --main: #c6805d;
                --text: #75491d;
            }

            [data-theme='4'] {
                --bg: #f4ead0;
                --main: #fcb772;
                --text: #ce6828;
            }

            [data-theme='5'] {
                --bg: #fef9da;
                --main: #f9d565;
                --text: #c87a29;
            }

            [data-theme='6'] {
                --bg: #eaedcf;
                --main: #b1c949;
                --text: #4e8a3f;
            }

            [data-theme='7'] {
                --bg: #cdeae9;
                --main: #59b7a5;
                --text: #126b77;
            }

            [data-theme='8'] {
                --bg: #d4eef8;
                --main: #4bbde9;
                --text: #315ba9;
            }

            [data-theme='9'] {
                --bg: #d6e5f2;
                --main: #9190c6;
                --text: #4556a6;
            }

            [data-theme='10'] {
                --bg: #ebdeed;
                --main: #ac62a7;
                --text: #5a2976;
            }

            [data-theme='11'] {
                --bg: linear-gradient(135deg, #fcdbdd, #fcdbdd, #f9f3c7, #f9f3c7, #e3f0e6, #e3f0e6, #daf0f5, #daf0f5, #fcdbdd, #fcdbdd, #fcdbdd);
                --main: #fff;
                --text: #829ab9;
            }

            @keyframes gradient {
                0% {
                    background-position: 0% 0%;
                }

                98% {
                    background-position: 82% 82%;
                }

                100% {
                    background-position: 100% 100%;
                }

            }

            html, body {
                font-family: 'Balsamiq Sans', sans-serif;
                background: var(--bg);
                background-size: 1000% 1000%;
                animation: gradient 12s ease-out infinite;
                color: var(--text);
                cursor: url(/assets/cursor/default.svg), default;

                -webkit-user-select: none;
                user-select: none;
            }

            img {
                width: calc(.9 * 512px);
                position: absolute;
                top: 20px;
                left: 26px;

                border: 2px solid var(--main);
                border-radius: 28px;
            }

            #wrapper {
                width: 512px;
                position: relative;
                margin: auto;
            }

            canvas {
                border: 2px solid var(--main);
                border-radius: 28px;
                margin: auto;

                transform: scale(.85);
            }

            #name {
                top: -193px;
                left: 295px;
                width: 160px;
            }

            #birth {
                top: -155px;
                left: 168px;
                width: 120px;
            }

            #location {
                top: -115px;
                left: 19px;
                width: 120px;
            }

            input[type='text'], input[type='text']:focus {
                position: relative;
                border: none;
                outline: none;
                background: transparent;
                font-family: sans-serif;
                font-size: 12px;
                color: var(--text);
                cursor: url(/assets/cursor/text.svg), text;
                text-transform: uppercase;
            }

            input[type='text']::placeholder {
                color: var(--text);
                opacity: .5;
                text-transform: none;
            }

            .menu {
                width: 400px;
                display: flex;
                justify-content: space-around;
                position: relative;
                margin: auto;
                margin-top: -12px;
            }

            .menu div {
                color: var(--text);
                cursor: url(/assets/cursor/pointer.svg), pointer;
                border-bottom: 3px dotted;
            }

            .menu div:hover {
                transform: scale(1.05);
                filter: brightness(1.15);
                transition-duration: .5s;
            }

            .arrow {

            }

            .arrow::after {
                content: '<——';
                letter-spacing: -10px;
                margin-right: 16px;
            }

            a, a:visited {
                text-decoration: none;
            }

            ::selection {
                background-color: var(--text);
                color: white;
            }

            .hide {
                display: none;
            }

        </style>

        <!-- favicon -->
        <link rel='icon' href='/assets/cursor/default.svg'>
    </head>


<body>
    <div id='wrapper'>
    <canvas id='canvas' height='341' width='512'></canvas>
    <input type='text' id='name' placeholder='( click to edit )'>
    <input type='text' id='birth' placeholder='( click to edit )'>
    <input type='text' id='location' placeholder='( click to edit )'>

    <div id='main-menu' class='menu'>
        <a href='/'>
            <div>go back</div>
        </a>
        <span>✦</span>
        <div id='download'>download image</div>
        <span>✦</span>
        <div id='reroll'>reroll variant</div>
    </div>

    <div id='download-menu' class='hide menu'>
        <div id='restart'>restart</div>
        <span>✦</span>
        <span style='font-size: 80%; line-height: 1.8'>right click / long press on the image to save it</span>
    </div>

    </div>

</body>


<script type='module'>
    import {loadImage, rollID} from '/script/useful.js';
    import {drawAll} from '/script/draw.js';
    import {parts} from '/script/state.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let first = true;
    let idVariant;
    let fields = {
        'name': '',
        'birth': '',
        'location': ''
    }
    const idImgs = {};

    function loadIDs() {
        for (let i = 0; i < 12; i++) {
            idImgs[i] = loadImage(`/assets/id/${i}.svg`);
        }
    }


    window.addEventListener('DOMContentLoaded', async () => {

        if (parts.background.src && parts.background.variant === -1)
            parts.background.img = await loadImage(parts.background.src);
        
        await loadIDs();
        
        idVariant = localStorage.getItem('idVariant');
        if (!idVariant) idVariant = rollID();
        document.documentElement.setAttribute('data-theme', idVariant);

        document.getElementById('download').onclick = download;
        document.getElementById('restart').onclick = () => {location.reload()};
        document.getElementById('reroll').addEventListener('click', () => {
            idVariant = rollID();
            document.documentElement.setAttribute('data-theme', idVariant);
            drawID();
        });

        document.querySelectorAll('input').forEach(input => {

          input.addEventListener('click', () => {
            input.style.opacity = 1;
            ctx.reset();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawID(input.id);
          });

          input.addEventListener('blur', () => {
            fields[input.id] = input.value.toUpperCase();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.reset();
            drawID();
            input.style.opacity = 0;
          });

        });

        drawID();
    });


    function download() {
        const dataURL = canvas.toDataURL('image/png');
        const img = document.createElement('img');
        img.src = dataURL;
        document.getElementById('wrapper').append(img);

        document.getElementById('main-menu').classList.add('hide');
        document.getElementById('download-menu').classList.remove('hide');
    }


    async function drawID(text = '') {

        let img;
        if (first) {
            
            img = new Image();
            img.src = `/assets/id/${idVariant}.svg`;
            img.onload = () => {drawComponents(img)};
            first = false;
        
        } else {
            const img = idImgs[idVariant];
            if (img) drawComponents(img);
        }
            

        function drawComponents(img) {
            // ID card
            ctx.reset();
            ctx.drawImage(img, 0, 0, 512, 341);

            ctx.translate(20, 120);
            ctx.scale(.4, .4);

            // Border
            const color = window.getComputedStyle(document.body).getPropertyValue('--main');

            ctx.roundRect(0, -3, canvas.width + 3, canvas.width + 3, 20);
            ctx.fillStyle = '#f7f1e9';
            ctx.fill();

            // Photo
            ctx.translate(0, -8);
            ctx.save();
            ctx.clip();

            drawAll(false, false);
            ctx.beginPath();
            ctx.roundRect(0, -3, canvas.width + 3, canvas.width + 3, 20);
            ctx.restore();
            ctx.lineWidth = 18;
            ctx.strokeStyle = color;
            ctx.stroke();

            //Text
            const textColor = window.getComputedStyle(document.body).getPropertyValue('--text');
            ctx.scale(3,3);
            ctx.fillStyle = textColor;
            ctx.font = '12px sans-serif';
            if (text !== 'name') ctx.fillText(fields.name, 235, 38);
            if (text !== 'birth') ctx.fillText(fields.birth, 272, 76);
            if (text !== 'location') ctx.fillText(fields.location, 248, 115);
        };
    }
</script>
</html>
